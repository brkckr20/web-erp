<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sunucuya ulaşılamıyor</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f0f0f0;
        color: #374151;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      .kutu {
        max-width: 420px;
        margin: 16px;
        padding: 32px;
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 2px;
        text-align: center;
      }
      .baslik {
        font-size: 15px;
        font-weight: 700;
        color: #121820;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 12px;
      }
      .aciklama {
        font-size: 13px;
        line-height: 1.6;
        color: #6b7280;
        margin-bottom: 24px;
      }
      .buton {
        display: inline-block;
        padding: 8px 20px;
        background: #f57c00;
        color: #fff;
        font-size: 13px;
        font-weight: 600;
        text-decoration: none;
        border-radius: 2px;
      }
    </style>
  </head>
  <body>
    <div class="kutu">
      <div class="baslik">Sunucuya ulaşılamıyor</div>
      <p class="aciklama">
        ERP sunucusuna bağlanılamadı. Ağ bağlantınızı kontrol edin, sunucu kapalıysa
        bir süre sonra tekrar deneyin.
      </p>
      <a class="buton" href="/">Tekrar Dene</a>
    </div>
  </body>
</html>
